<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Product-page studies | The True Hive</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to product</a>
    <aside class="review-tools" aria-label="Product-page review controls">
      <div class="wrap review-row">
        <a href="../index.html">Design studio</a>
        <strong>Product pages only</strong>
        <span>Design preview / No live orders</span>
        <label>Direction<select id="design-switch"></select></label>
        <label>Product<select id="product-switch"></select></label>
      </div>
      <p class="wrap design-note" id="design-note"></p>
    </aside>
    <div class="header-frame">
      <header class="site-header wrap">
        <a class="brand" href="https://thetruehive.com/">
          <img src="../assets/favicon.svg" width="48" height="48" alt="" />
          <span>THE TRUE HIVE<small>Madisonville, Tennessee</small></span>
        </a>
        <nav aria-label="Main navigation">
          <a href="https://thetruehive.com/goods" aria-current="page">Store</a>
          <a href="https://thetruehive.com/services">Services</a>
          <a href="https://thetruehive.com/about">About us</a>
        </nav>
      </header>
    </div>
    <main id="main" class="wrap">
      <nav class="store-nav" aria-label="Store navigation">
        <a href="https://thetruehive.com/goods">All products</a>
        <a href="https://thetruehive.com/goods#pickup">Pickup</a>
        <a href="https://thetruehive.com/cart">Cart</a>
      </nav>
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="https://thetruehive.com/goods">Store</a>
        <span aria-hidden="true">/</span
        ><span id="crumb" aria-current="page">Soap</span>
      </nav>
      <div id="study-content" tabindex="-1">
        <h1>Loading product study.</h1>
      </div>
      <p id="preview-status" role="status" aria-live="polite"></p>
    </main>
    <footer class="site-footer wrap">
      <p>THE TRUE HIVE<small>Madisonville, Tennessee</small></p>
      <nav aria-label="Footer navigation">
        <a href="https://thetruehive.com/contact">Contact us</a>
        <a href="https://thetruehive.com/privacy">Privacy</a>
        <a href="https://thetruehive.com/accessibility">Accessibility</a>
      </nav>
    </footer>
    <noscript
      >These design studies require JavaScript.
      <a href="https://thetruehive.com/goods"
        >Visit the current store.</a
      ></noscript
    >
  </body>
</html>
